name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore Scanio.slnx --locked-mode
      - name: Test solution
        run: dotnet test Scanio.slnx -c Release --no-restore --logger "trx;LogFileName=release-windows.trx"
      - name: Upload rendered UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-test-results-and-screenshots
          path: |
            **/TestResults/*.trx
            **/TestResults/screenshots/**/*.png
          if-no-files-found: error
      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $publish = Join-Path $PWD "artifacts/publish"
          dotnet publish src/Scanio.Presentation/Scanio.Presentation.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -o $publish
          $process = Start-Process (Join-Path $publish "Scanio.exe") -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              Get-WinEvent -FilterHashtable @{
                LogName = "Application"
                StartTime = (Get-Date).AddMinutes(-2)
              } -ErrorAction SilentlyContinue |
                Where-Object Message -Match "Scanio|Scanio.exe" |
                Select-Object -First 5 TimeCreated, ProviderName, Id, Message |
                Format-List
              throw "Published Scanio exited during startup with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              if (-not $process.WaitForExit(10_000)) {
                throw "Published Scanio process did not exit within 10 seconds after forced stop."
              }
            }
          }
      - name: Build portable package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $publish = Join-Path $PWD "artifacts/publish"
          $portable = Join-Path $PWD "artifacts/Scanio-$version-win-x64-portable"
          Copy-Item -LiteralPath $publish -Destination $portable -Recurse
          New-Item -ItemType Directory -Force -Path (Join-Path $portable "Data") | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $portable "portable.flag"), "", [System.Text.UTF8Encoding]::new($false))
          Copy-Item README.md (Join-Path $portable "README.md")
          $portableDatabase = Join-Path $portable "Data/scanio.db"
          $process = Start-Process (Join-Path $portable "Scanio.exe") -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Portable Scanio exited during startup with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              if (-not $process.WaitForExit(10_000)) {
                throw "Portable Scanio process did not exit within 10 seconds after forced stop."
              }
            }
          }
          if (-not (Test-Path $portableDatabase)) {
            throw "Portable Scanio did not initialize Data/scanio.db."
          }
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath "artifacts/Scanio-$version-win-x64-portable.zip"
      - name: Compile per-user installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $publish = Join-Path $PWD "artifacts/publish"
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 compiler ISCC.exe was not found on the Windows runner." }
          $expectedIsccVersion = [Version]"6.7.1.0"
          $isccVersionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($iscc)
          $isccFileVersion = [Version]::new(
            $isccVersionInfo.FileMajorPart,
            $isccVersionInfo.FileMinorPart,
            $isccVersionInfo.FileBuildPart,
            $isccVersionInfo.FilePrivatePart)
          $isccProductVersion = [Version]::new(
            $isccVersionInfo.ProductMajorPart,
            $isccVersionInfo.ProductMinorPart,
            $isccVersionInfo.ProductBuildPart,
            $isccVersionInfo.ProductPrivatePart)
          if ($isccFileVersion -ne $expectedIsccVersion -or $isccProductVersion -ne $expectedIsccVersion) {
            throw "Inno Setup compiler version mismatch. Expected FileVersion/ProductVersion $expectedIsccVersion, found FileVersion $isccFileVersion and ProductVersion $isccProductVersion at '$iscc'."
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$publish" "/DOutputDir=$(Join-Path $PWD 'artifacts')" "installer/Scanio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
      - name: Verify silent installer and retained local data
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $installDir = Join-Path $env:RUNNER_TEMP "ScanioInstallerProbe"
          $dataDirectory = Join-Path $env:LOCALAPPDATA "Scanio"
          $marker = Join-Path $dataDirectory "installer-retention.marker"
          $setup = Join-Path $PWD "artifacts/Scanio-$version-win-x64-setup.exe"

          if (Test-Path $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dataDirectory | Out-Null
          if (Test-Path $marker) {
            Remove-Item -LiteralPath $marker -Force
          }
          [System.IO.File]::WriteAllText($marker, "retained", [System.Text.UTF8Encoding]::new($false))

          try {
            & $setup "/VERYSILENT" "/SUPPRESSMSGBOXES" "/NORESTART" "/SP-" "/DIR=$installDir"
            if ($LASTEXITCODE -ne 0) { throw "Silent installer failed with exit code $LASTEXITCODE." }

            $installedExe = Join-Path $installDir "Scanio.exe"
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (-not (Test-Path $installedExe)) { throw "Installed Scanio.exe was not found." }
            if (-not (Test-Path $uninstaller)) { throw "Installed unins000.exe was not found." }
            if (Test-Path (Join-Path $installDir "portable.flag")) { throw "Installed package must not contain portable.flag." }

            $process = Start-Process $installedExe -PassThru
            try {
              Start-Sleep -Seconds 5
              if ($process.HasExited) { throw "Installed Scanio exited during startup with code $($process.ExitCode)." }
            }
            finally {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
                if (-not $process.WaitForExit(10_000)) {
                  throw "Installed Scanio process did not exit within 10 seconds after forced stop."
                }
              }
            }

            & $uninstaller "/VERYSILENT" "/SUPPRESSMSGBOXES" "/NORESTART"
            if ($LASTEXITCODE -ne 0) { throw "Silent uninstaller failed with exit code $LASTEXITCODE." }
            if (Test-Path $installedExe) { throw "Installed Scanio.exe remains after uninstall." }
            if (-not (Test-Path $marker)) { throw "Local data marker was not retained after uninstall." }
            if (Test-Path $installDir) {
              $leftovers = @(Get-ChildItem -LiteralPath $installDir -Force)
              if ($leftovers.Count -gt 0) {
                $leftoverNames = $leftovers.Name | Sort-Object
                throw "Installer probe retained files after uninstall: $($leftoverNames -join ', ')."
              }
              Remove-Item -LiteralPath $installDir -Force
            }
          }
          finally {
            if (Test-Path $marker) {
              Remove-Item -LiteralPath $marker -Force
            }
          }
      - name: Write package checksums
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $packages = @(
            (Join-Path $PWD "artifacts/Scanio-$version-win-x64-portable.zip"),
            (Join-Path $PWD "artifacts/Scanio-$version-win-x64-setup.exe")
          ) | Sort-Object
          if ($packages.Count -ne 2) {
            throw "Expected exactly two release packages for SHA256SUMS.txt; found $($packages.Count)."
          }
          $checksums = foreach ($package in $packages) {
            $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $package)"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "artifacts/SHA256SUMS.txt"),
            (($checksums -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) {
            throw "Release notes not found: $notes"
          }
          gh release create "${{ github.ref_name }}" `
            "artifacts/Scanio-$version-win-x64-portable.zip" `
            "artifacts/Scanio-$version-win-x64-setup.exe" `
            artifacts/SHA256SUMS.txt `
            --title "Scanio ${{ github.ref_name }}" `
            --notes-file $notes `
            --prerelease
