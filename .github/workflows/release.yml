name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore Scanio.slnx --locked-mode
      - name: Test solution
        run: dotnet test Scanio.slnx -c Release --no-restore --logger "trx;LogFileName=release-windows.trx"
      - name: Upload rendered UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-test-results-and-screenshots
          path: |
            **/TestResults/*.trx
            **/TestResults/screenshots/**/*.png
          if-no-files-found: error
      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $folder = "artifacts/Scanio-$version-win-x64-portable"
          dotnet publish src/Scanio.Presentation/Scanio.Presentation.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -o $folder
          New-Item -ItemType Directory -Force -Path "$folder/Data" | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $PWD "$folder/portable.flag"), "", [System.Text.UTF8Encoding]::new($false))
          Copy-Item README.md "$folder/README.md"
          $process = Start-Process (Join-Path $folder "Scanio.exe") -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              Get-WinEvent -FilterHashtable @{
                LogName = "Application"
                StartTime = (Get-Date).AddMinutes(-2)
              } -ErrorAction SilentlyContinue |
                Where-Object Message -Match "Scanio|Scanio.exe" |
                Select-Object -First 5 TimeCreated, ProviderName, Id, Message |
                Format-List
              throw "Published Scanio exited during startup with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
          Compress-Archive -Path "$folder/*" -DestinationPath "artifacts/Scanio-$version-win-x64-portable.zip"
          $hash = (Get-FileHash "artifacts/Scanio-$version-win-x64-portable.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$hash  Scanio-$version-win-x64-portable.zip`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "artifacts/SHA256SUMS.txt"),
            $checksum,
            [System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) {
            throw "Release notes not found: $notes"
          }
          gh release create "${{ github.ref_name }}" `
            artifacts/Scanio-*-win-x64-portable.zip `
            artifacts/SHA256SUMS.txt `
            --title "Scanio ${{ github.ref_name }}" `
            --notes-file $notes `
            --prerelease
