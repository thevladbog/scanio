name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore Scanio.slnx --locked-mode
      - name: Test solution
        run: dotnet test Scanio.slnx -c Release --no-restore --logger "trx;LogFileName=release-windows.trx"
      - name: Upload rendered UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-test-results-and-screenshots
          path: |
            **/TestResults/*.trx
            **/TestResults/screenshots/**/*.png
          if-no-files-found: error
      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $publish = Join-Path $PWD "artifacts/publish"
          dotnet publish src/Scanio.Presentation/Scanio.Presentation.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -o $publish
          $process = Start-Process (Join-Path $publish "Scanio.exe") -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              Get-WinEvent -FilterHashtable @{
                LogName = "Application"
                StartTime = (Get-Date).AddMinutes(-2)
              } -ErrorAction SilentlyContinue |
                Where-Object Message -Match "Scanio|Scanio.exe" |
                Select-Object -First 5 TimeCreated, ProviderName, Id, Message |
                Format-List
              throw "Published Scanio exited during startup with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              if (-not $process.WaitForExit(10000)) {
                throw "Published Scanio process did not exit within 10 seconds after forced stop."
              }
            }
          }
      - name: Build portable package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $publish = Join-Path $PWD "artifacts/publish"
          $portable = Join-Path $PWD "artifacts/Scanio-$version-win-x64-portable"
          Copy-Item -LiteralPath $publish -Destination $portable -Recurse
          New-Item -ItemType Directory -Force -Path (Join-Path $portable "Data") | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $portable "portable.flag"), "", [System.Text.UTF8Encoding]::new($false))
          Copy-Item README.md (Join-Path $portable "README.md")
          $portableDatabase = Join-Path $portable "Data/scanio.db"
          $process = Start-Process (Join-Path $portable "Scanio.exe") -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Portable Scanio exited during startup with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              if (-not $process.WaitForExit(10000)) {
                throw "Portable Scanio process did not exit within 10 seconds after forced stop."
              }
            }
          }
          if (-not (Test-Path $portableDatabase)) {
            throw "Portable Scanio did not initialize Data/scanio.db."
          }
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath "artifacts/Scanio-$version-win-x64-portable.zip"
      - name: Compile per-user installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $publish = Join-Path $PWD "artifacts/publish"
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 compiler ISCC.exe was not found on the Windows runner." }
          $expectedInnoSetupVersion = "6.7.1"
          $registryPath = "SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1"
          $uninstallRoot = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
            [Microsoft.Win32.RegistryHive]::LocalMachine,
            [Microsoft.Win32.RegistryView]::Registry32)
          try {
            $innoSetupKey = $uninstallRoot.OpenSubKey($registryPath)
            if ($null -eq $innoSetupKey) {
              throw "Inno Setup registry pin failed. Expected version '$expectedInnoSetupVersion' at Registry32 HKLM\$registryPath for selected compiler '$iscc', but the uninstall key was not found."
            }
            try {
              $installedVersion = [string]$innoSetupKey.GetValue("DisplayVersion")
              $installLocationValue = [string]$innoSetupKey.GetValue("InstallLocation")
              if ($installedVersion -cne $expectedInnoSetupVersion) {
                throw "Inno Setup registry pin failed. Expected version '$expectedInnoSetupVersion', found '$installedVersion' at Registry32 HKLM\$registryPath for selected compiler '$iscc'."
              }
              if ([string]::IsNullOrWhiteSpace($installLocationValue)) {
                throw "Inno Setup registry pin failed. Expected InstallLocation for version '$expectedInnoSetupVersion', found an empty value at Registry32 HKLM\$registryPath for selected compiler '$iscc'."
              }
              $selectedCompilerDirectory = [System.IO.Path]::GetFullPath((Split-Path -Parent $iscc)).TrimEnd(
                [System.IO.Path]::DirectorySeparatorChar,
                [System.IO.Path]::AltDirectorySeparatorChar)
              $installedLocation = [System.IO.Path]::GetFullPath($installLocationValue).TrimEnd(
                [System.IO.Path]::DirectorySeparatorChar,
                [System.IO.Path]::AltDirectorySeparatorChar)
              if (-not [string]::Equals(
                $installedLocation,
                $selectedCompilerDirectory,
                [StringComparison]::OrdinalIgnoreCase)) {
                throw "Inno Setup registry pin failed. Expected InstallLocation '$selectedCompilerDirectory', found '$installedLocation' at Registry32 HKLM\$registryPath for selected compiler '$iscc'."
              }
            }
            finally {
              $innoSetupKey.Dispose()
            }
          }
          finally {
            $uninstallRoot.Dispose()
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$publish" "/DOutputDir=$(Join-Path $PWD 'artifacts')" "installer/Scanio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
      - name: Verify installer refuses a portable directory
        shell: pwsh
        run: |
          function Get-ProbeManifest([string]$Path) {
            @(
              Get-ChildItem -LiteralPath $Path -Recurse -Force |
                ForEach-Object {
                  $relativePath = [System.IO.Path]::GetRelativePath($Path, $_.FullName)
                  if ($_.PSIsContainer) {
                    "D|$relativePath"
                  }
                  else {
                    $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                    "F|$relativePath|$hash"
                  }
                } |
                Sort-Object
            )
          }

          $setups = @(Get-ChildItem -LiteralPath (Join-Path $PWD "artifacts") -Filter "Scanio-*-win-x64-setup.exe" -File)
          if ($setups.Count -ne 1) {
            throw "Expected exactly one installer for the portable-directory refusal probe; found $($setups.Count)."
          }
          $setup = $setups[0].FullName
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $probeName = "ScanioPortableConflictProbe-$([Guid]::NewGuid().ToString('N'))"
          $portableConflictDir = Join-Path $runnerTemp $probeName
          if (Test-Path -LiteralPath $portableConflictDir) {
            throw "Fresh portable-directory refusal probe already exists: $portableConflictDir"
          }

          $probeCreated = $false
          try {
            New-Item -ItemType Directory -Path (Join-Path $portableConflictDir "Data") | Out-Null
            $probeCreated = $true
            [System.IO.File]::WriteAllText(
              (Join-Path $portableConflictDir "portable.flag"),
              "portable",
              [System.Text.UTF8Encoding]::new($false))
            [System.IO.File]::WriteAllText(
              (Join-Path $portableConflictDir "Data/scanio.db"),
              "portable-database-marker",
              [System.Text.UTF8Encoding]::new($false))
            $manifestBefore = Get-ProbeManifest $portableConflictDir

            $installerProcess = Start-Process -FilePath $setup -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/SP-",
              "/DIR=$portableConflictDir"
            ) -Wait -PassThru
            $installerExitCode = $installerProcess.ExitCode
            if ($installerExitCode -eq 0) {
              throw "Installer accepted a directory containing portable.flag."
            }

            $manifestAfter = Get-ProbeManifest $portableConflictDir
            $manifestChanges = @(
              Compare-Object -ReferenceObject $manifestBefore -DifferenceObject $manifestAfter
            )
            if ($manifestChanges.Count -gt 0) {
              throw "Installer modified portable data before refusing the target directory: $($manifestChanges | Out-String)"
            }
          }
          finally {
            if ($probeCreated -and (Test-Path -LiteralPath $portableConflictDir)) {
              Remove-Item -LiteralPath $portableConflictDir -Recurse -Force
            }
          }
      - name: Verify silent installer and retained local data
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          function Invoke-BoundedProcess {
            param(
              [Parameter(Mandatory = $true)]
              [string] $FilePath,
              [Parameter(Mandatory = $true)]
              [string[]] $ArgumentList,
              [Parameter(Mandatory = $true)]
              [string] $Description
            )

            $processTimeoutMilliseconds = 120000
            $cleanupTimeoutMilliseconds = 10000
            $externalProcess = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
            try {
              if (-not $externalProcess.WaitForExit($processTimeoutMilliseconds)) {
                try {
                  $externalProcess.Kill($true)
                }
                catch [System.InvalidOperationException] {
                  if (-not $externalProcess.HasExited) { throw }
                }
                if (-not $externalProcess.WaitForExit($cleanupTimeoutMilliseconds)) {
                  throw "$Description timed out after 120 seconds, and its process tree did not exit within 10 seconds after termination."
                }
                throw "$Description timed out after 120 seconds; its process tree was terminated."
              }

              $exitCode = $externalProcess.ExitCode
              return $exitCode
            }
            finally {
              $externalProcess.Dispose()
            }
          }

          $version = $env:RELEASE_TAG.TrimStart('v')
          $installDir = Join-Path $env:RUNNER_TEMP "ScanioInstallerProbe"
          $dataDirectory = Join-Path $env:LOCALAPPDATA "Scanio"
          $marker = Join-Path $dataDirectory "installer-retention.marker"
          $setup = Join-Path $PWD "artifacts/Scanio-$version-win-x64-setup.exe"

          if (Test-Path $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dataDirectory | Out-Null
          if (Test-Path $marker) {
            Remove-Item -LiteralPath $marker -Force
          }
          [System.IO.File]::WriteAllText($marker, "retained", [System.Text.UTF8Encoding]::new($false))

          try {
            $setupExitCode = Invoke-BoundedProcess -FilePath $setup -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/SP-",
              ('/DIR="{0}"' -f $installDir)
            ) -Description "Silent installer"
            if ($setupExitCode -ne 0) { throw "Silent installer failed with exit code $setupExitCode." }

            $installedExe = Join-Path $installDir "Scanio.exe"
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (-not (Test-Path $installedExe)) { throw "Installed Scanio.exe was not found." }
            if (-not (Test-Path $uninstaller)) { throw "Installed unins000.exe was not found." }
            if (Test-Path (Join-Path $installDir "portable.flag")) { throw "Installed package must not contain portable.flag." }

            $process = Start-Process $installedExe -PassThru
            try {
              Start-Sleep -Seconds 5
              if ($process.HasExited) { throw "Installed Scanio exited during startup with code $($process.ExitCode)." }
            }
            finally {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
                if (-not $process.WaitForExit(10000)) {
                  throw "Installed Scanio process did not exit within 10 seconds after forced stop."
                }
              }
            }

            $uninstallerExitCode = Invoke-BoundedProcess -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART"
            ) -Description "Silent uninstaller"
            if ($uninstallerExitCode -ne 0) { throw "Silent uninstaller failed with exit code $uninstallerExitCode." }
            if (Test-Path $installedExe) { throw "Installed Scanio.exe remains after uninstall." }
            if (-not (Test-Path $marker)) { throw "Local data marker was not retained after uninstall." }
            if (Test-Path $installDir) {
              $leftovers = @(Get-ChildItem -LiteralPath $installDir -Force)
              if ($leftovers.Count -gt 0) {
                $leftoverNames = $leftovers.Name | Sort-Object
                throw "Installer probe retained files after uninstall: $($leftoverNames -join ', ')."
              }
              Remove-Item -LiteralPath $installDir -Force
            }
          }
          finally {
            if (Test-Path $marker) {
              Remove-Item -LiteralPath $marker -Force
            }
          }
      - name: Write package checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $packages = @(
            (Join-Path $PWD "artifacts/Scanio-$version-win-x64-portable.zip"),
            (Join-Path $PWD "artifacts/Scanio-$version-win-x64-setup.exe")
          ) | Sort-Object
          if ($packages.Count -ne 2) {
            throw "Expected exactly two release packages for SHA256SUMS.txt; found $($packages.Count)."
          }
          $checksums = foreach ($package in $packages) {
            $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $package)"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "artifacts/SHA256SUMS.txt"),
            (($checksums -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseTag = $env:RELEASE_TAG
          $version = $releaseTag.TrimStart('v')
          $notes = "docs/releases/$releaseTag.md"
          if (-not (Test-Path $notes)) {
            throw "Release notes not found: $notes"
          }
          gh release create $releaseTag `
            "artifacts/Scanio-$version-win-x64-portable.zip" `
            "artifacts/Scanio-$version-win-x64-setup.exe" `
            artifacts/SHA256SUMS.txt `
            --title "Scanio $releaseTag" `
            --notes-file $notes `
            --prerelease
