name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore Scanio.slnx --locked-mode
      - name: Test solution
        run: dotnet test Scanio.slnx -c Release --no-restore
      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $folder = "artifacts/Scanio-$version-win-x64-portable"
          dotnet publish src/Scanio.Presentation/Scanio.Presentation.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -o $folder
          New-Item -ItemType Directory -Force -Path "$folder/data" | Out-Null
          Copy-Item README.md "$folder/README.md"
          Compress-Archive -Path "$folder/*" -DestinationPath "artifacts/Scanio-$version-win-x64-portable.zip"
          $hash = (Get-FileHash "artifacts/Scanio-$version-win-x64-portable.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Scanio-$version-win-x64-portable.zip" | Set-Content "artifacts/SHA256SUMS.txt" -Encoding ascii
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/Scanio-*-win-x64-portable.zip `
            artifacts/SHA256SUMS.txt `
            --title "Scanio ${{ github.ref_name }}" `
            --notes-file docs/releases/v0.1.0-alpha.1.md `
            --prerelease
