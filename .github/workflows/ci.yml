name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable core / macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore Scanio.slnx --locked-mode
      - name: Test portable projects
        run: |
          dotnet test tests/Scanio.Capture.Tests/Scanio.Capture.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=capture.trx"
          dotnet test tests/Scanio.Analysis.Tests/Scanio.Analysis.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=analysis.trx"
          dotnet test tests/Scanio.Transports.Tests/Scanio.Transports.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=transports.trx"
          dotnet test tests/Scanio.Application.Tests/Scanio.Application.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=application.trx"
          dotnet test tests/Scanio.Storage.Tests/Scanio.Storage.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=storage.trx"
          dotnet test tests/Scanio.Presentation.Tests/Scanio.Presentation.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=presentation.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: error
  windows:
    name: Full solution / Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore Scanio.slnx --locked-mode
      - name: Test solution
        run: dotnet test Scanio.slnx -c Release --no-restore --logger "trx;LogFileName=windows.trx"
      - name: Build WPF application
        run: dotnet build src/Scanio.Presentation/Scanio.Presentation.csproj -c Release -f net10.0-windows10.0.19041.0 --no-restore
      - name: Smoke launch published WPF application
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP "scanio-startup-smoke"
          dotnet publish src/Scanio.Presentation/Scanio.Presentation.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -o $publish
          [System.IO.File]::WriteAllText(
            (Join-Path $publish "portable.flag"),
            "",
            [System.Text.UTF8Encoding]::new($false))
          $process = Start-Process (Join-Path $publish "Scanio.exe") -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              Get-WinEvent -FilterHashtable @{
                LogName = "Application"
                StartTime = (Get-Date).AddMinutes(-2)
              } -ErrorAction SilentlyContinue |
                Where-Object Message -Match "Scanio|Scanio.exe" |
                Select-Object -First 5 TimeCreated, ProviderName, Id, Message |
                Format-List
              throw "Scanio exited during the startup smoke test with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-and-screenshots
          path: |
            **/TestResults/*.trx
            **/TestResults/screenshots/**/*.png
          if-no-files-found: error
